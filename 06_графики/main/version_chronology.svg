<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Version chronology"><title>Version chronology</title><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#1f2937}.title{font-size:22px;font-weight:700}.subtitle{font-size:13px;fill:#4b5563}.axis{stroke:#4b5563;stroke-width:1}.grid{stroke:#d1d5db;stroke-width:1}.legend{font-size:12px}.label{font-size:12px}.tick{font-size:11px;fill:#4b5563}</style><rect x="0" y="0" width="1400" height="620" fill="#ffffff"/><text class="title" x="24" y="36">Хронология исследовательских версий лягушки</text><text class="subtitle" x="24" y="60">Отдельно показаны ветки честности homeostasis для ANN и compare/runtime-ветки для BioFrog.</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#cbd5e1" stroke-width="4"/><line x1="80" y1="410" x2="1320" y2="410" stroke="#cbd5e1" stroke-width="4"/><text class="label" x="80" y="130">ANN / homeostatic fairness</text><text class="label" x="80" y="370">BioFrog / compare-runtime ветка</text><circle cx="140" cy="170" r="22" fill="#2f80ed"/><text x="140" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">ANN</text><text class="legend" x="140" y="216" text-anchor="middle">Базовый RL-ANN</text><circle cx="320" cy="170" r="22" fill="#1f5fbf"/><text x="320" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">SATED</text><text class="legend" x="320" y="216" text-anchor="middle">Жёсткое насыщение</text><circle cx="500" cy="170" r="22" fill="#154a94"/><text x="500" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">SOFT</text><text class="legend" x="500" y="216" text-anchor="middle">Плавное ослабление</text><circle cx="700" cy="170" r="22" fill="#0d356c"/><text x="700" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">V2</text><text class="legend" x="700" y="216" text-anchor="middle">Честнее, но wrong-sign bias</text><circle cx="900" cy="170" r="22" fill="#081f45"/><text x="900" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">V3</text><text class="legend" x="900" y="216" text-anchor="middle">Инстинкт перенесён вверх, но переторможен</text><circle cx="1120" cy="170" r="22" fill="#103260"/><text x="1120" y="175" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">V3.1</text><text class="legend" x="1120" y="216" text-anchor="middle">Смягчённый V3; текущий компромисс</text><circle cx="140" cy="410" r="22" fill="#e67e22"/><text x="140" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">BIO</text><text class="legend" x="140" y="456" text-anchor="middle">Исходный биоморфный runtime</text><circle cx="340" cy="410" r="22" fill="#ff9b3d"/><text x="340" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">COMPARE</text><text class="legend" x="340" y="456" text-anchor="middle">Task-set floor для честного сравнения</text><circle cx="560" cy="410" r="22" fill="#b85c11"/><text x="560" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">DUAL</text><text class="legend" x="560" y="456" text-anchor="middle">Двуконтурный prey-capture runtime</text><circle cx="760" cy="410" r="22" fill="#f2a65a"/><text x="760" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">FAST</text><text class="legend" x="760" y="456" text-anchor="middle">Ускоренная версия</text><circle cx="980" cy="410" r="22" fill="#cf7b2f"/><text x="980" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">DUAL_COMPARE</text><text class="legend" x="980" y="456" text-anchor="middle">Сравнимый dual runtime</text><circle cx="1220" cy="410" r="22" fill="#a75a1c"/><text x="1220" y="415" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">DUAL_FAST_COMPARE</text><text class="legend" x="1220" y="456" text-anchor="middle">Текущий compare-ready компромисс</text><text class="subtitle" x="80" y="548">Смысл ANN-ветки: постепенно убрать прямой постконтроллер насыщения и сделать comparison более homeostatically честным.</text><text class="subtitle" x="80" y="570">Смысл BIO-ветки: удержать биоморфность, но сделать режим охоты и benchmark-сравнение ближе к условиям ANN/SNN.</text></svg>